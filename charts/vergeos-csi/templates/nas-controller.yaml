{{- if .Values.nas.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vergeos-csi.name" . }}-nas-controller
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "vergeos-csi.name" . }}-nas-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "vergeos-csi.name" . }}-nas-controller
  template:
    metadata:
      labels:
        app: {{ include "vergeos-csi.name" . }}-nas-controller
      {{- with include "vergeos-csi.caAnnotations" . }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "vergeos-csi.controllerName" . }}
      {{- with .Values.controller.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: csi-vergeos
          image: {{ include "vergeos-csi.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--driver=nas"
            - "--mode=controller"
            - "--endpoint=unix:///csi/csi.sock"
            - "--v={{ .Values.logLevel }}"
          envFrom:
            - secretRef:
                name: {{ include "vergeos-csi.secretName" . }}
          {{- with include "vergeos-csi.caEnv" . }}
          {{- . | nindent 10 }}
          {{- end }}
          ports:
            - name: healthz
              containerPort: 9808
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 10
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            {{- with include "vergeos-csi.caVolumeMount" . }}
            {{- . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}

        - name: csi-provisioner
          image: {{ .Values.sidecars.provisioner.image }}
          args:
            - "--csi-address=/csi/csi.sock"
            - "--v={{ .Values.logLevel }}"
            - "--leader-election"
            - "--leader-election-namespace={{ .Release.Namespace }}"
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi

        - name: liveness-probe
          image: {{ .Values.sidecars.liveness.image }}
          args:
            - "--csi-address=/csi/csi.sock"
            - "--http-endpoint=:9808"
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi

      volumes:
        - name: socket-dir
          emptyDir: {}
        {{- with include "vergeos-csi.caVolume" . }}
        {{- . | nindent 8 }}
        {{- end }}
{{- end }}
