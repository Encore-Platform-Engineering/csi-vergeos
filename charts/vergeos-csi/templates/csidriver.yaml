{{- if .Values.nas.enabled }}
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: csi-nas.verge.io
spec:
  attachRequired: false
  podInfoOnMount: false
  # NFS: no fsGroup chown (squash/export settings decide ownership)
  fsGroupPolicy: None
  volumeLifecycleModes:
    - Persistent
{{- end }}
{{- if .Values.block.enabled }}
---
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: csi-block.verge.io
spec:
  attachRequired: true
  podInfoOnMount: false
  # kubelet applies the pod fsGroup on every mount; PVs carry no fsType, so the
  # default ReadWriteOnceWithFSType would skip it (non-root pods can't write)
  fsGroupPolicy: File
  volumeLifecycleModes:
    - Persistent
{{- end }}
