name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: Chart requires block.poolVmId
        run: |
          ! helm template x charts/vergeos-csi
          helm template x charts/vergeos-csi --set block.poolVmId=1 > /dev/null
      - name: Chart has no hardcoded kubelet dir
        run: |
          helm template x charts/vergeos-csi --set block.poolVmId=1 --set kubeletDir=/var/lib/k0s/kubelet > /tmp/k0s.yaml
          ! grep -q '/var/lib/kubelet' /tmp/k0s.yaml
      - name: Chart/manifest assertions (mounts, RBAC, probes, image refs)
        env:
          # On a v* tag the chart image must be exactly the tag the image job pushes.
          IMAGE_REF_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: hack/check-chart.sh

  chart:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      CHART: charts/vergeos-csi
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v5
      - name: Tag must be v + chart version
        run: |
          v=$(yq eval '.version' "$CHART/Chart.yaml")
          [ "$TAG" = "v$v" ] || { echo "::error::tag $TAG != v$v (Chart.yaml version)"; exit 1; }
      - name: Package and push chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm package "$CHART" -d "$RUNNER_TEMP"
          printf '%s' "$GITHUB_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm push "$RUNNER_TEMP/vergeos-csi-${TAG#v}.tgz" oci://ghcr.io/encore-platform-engineering/charts

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/encore-platform-engineering/csi-vergeos
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: VERSION=${{ github.sha }}
      - name: Log in to ghcr.io
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          build-args: VERSION=${{ github.ref_name }}
